name: Сборка Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/habit-tracker-app-zpj1he]
    tags: ["v*"]
    paths: ["web/**", "mobile/**", ".github/workflows/build-android.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Сборка страницы из артефакта
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
      - name: Подготовка проекта Capacitor
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          mkdir -p www && cp ../app/index.html www/
          npx cap sync android
      - name: Сборка APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Подпись постоянным ключом из секретов"
          else
            echo "::warning::Секреты ключа подписи не заданы — APK подписан временным ключом, обновление потребует удалить старую версию"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/Privychki.apk
          rm -f release.keystore
      - name: Проверка подписи и версии
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs out/Privychki.apk | head -3
          $BT/aapt2 dump badging out/Privychki.apk | grep -E "package:|application-label|uses-permission" | head -12
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запуск на эмуляторе Android
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r out/Privychki.apk
            adb shell pm grant app.habittracker.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p app.habittracker.mobile -c android.intent.category.LAUNCHER 1
            sleep 25
            mkdir -p emu
            adb exec-out screencap -p > emu/screen.png
            adb logcat -d > emu/logcat.txt
            adb shell pidof app.habittracker.mobile > emu/pid.txt || true
            grep -E "FATAL EXCEPTION|AndroidRuntime: Process: app.habittracker" emu/logcat.txt && exit 1 || true
            test -s emu/pid.txt
            grep -E "Capacitor/Console.*(Error|error)" emu/logcat.txt | head -20 || true
            echo "OK: приложение запущено и работает"
      - name: Скриншот с эмулятора
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-check
          path: emu/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Privychki-android
          path: out/Privychki.apk
          retention-days: 90
      - name: Выпуск (Releases) при теге v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/Privychki.apk
