name: Сборка Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main, claude/habit-tracker-app-zpj1he]
    tags: ["v*"]
    paths: ["web/**", "mobile/**", "store/**", "tools/check_features.py", ".github/workflows/build-android.yml"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Сборка страницы из артефакта
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          node build.mjs
      - name: Проверка функций в браузере (языки, защита, будильники, уведомления)
        run: |
          pip install playwright
          mkdir -p mobile/www && cp app/index.html mobile/www/
          python tools/check_features.py mobile/www check_out
      - name: Скриншоты проверки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-check
          path: check_out/
          retention-days: 14
      - name: Подготовка проекта Capacitor
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          mkdir -p www && cp ../app/index.html www/
          npx cap sync android
      - name: Сборка APK
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Подпись постоянным ключом из секретов"
          else
            echo "::warning::Секреты ключа подписи не заданы — APK подписан временным ключом, обновление потребует удалить старую версию"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/Privychki.apk
          # отладочная сборка того же кода — только для проверки на эмуляторе (в ней Capacitor пишет журнал страницы)
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../out-debug && cp app/build/outputs/apk/debug/app-debug.apk ../../out-debug/
          # AAB для Google Play — только с постоянным ключом (ключ загрузки Play App Signing)
          if [ -f release.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew bundleRelease --no-daemon
            mkdir -p ../../play
            cp app/build/outputs/bundle/release/app-release.aab ../../play/Privychki.aab
          else
            echo "::warning::AAB для Google Play не собран: нужны секреты ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD"
          fi
          rm -f release.keystore
      - name: Проверка подписи и версии
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs out/Privychki.apk | head -3
          if $BT/apksigner verify --print-certs out/Privychki.apk | grep -q "CN=Android Debug"; then
            echo "::warning::APK подписан временным отладочным ключом"
          fi
          $BT/aapt2 dump badging out/Privychki.apk | grep -E "package:|application-label|uses-permission" | head -12
      - name: Включить KVM для эмулятора
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запуск на эмуляторе Android
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p emu
            adb install -r out/Privychki.apk
            adb shell pm grant app.habittracker.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p app.habittracker.mobile -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > emu/screen.png
            adb logcat -d > emu/logcat-release.txt
            adb shell pidof app.habittracker.mobile > emu/pid.txt || true
            grep -E "FATAL EXCEPTION|AndroidRuntime: Process: app.habittracker" emu/logcat-release.txt && exit 1 || true
            test -s emu/pid.txt
            echo "OK: релизный APK запущен"
            adb uninstall app.habittracker.mobile
            adb logcat -c
            adb install -r out-debug/app-debug.apk
            adb shell pm grant app.habittracker.mobile android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p app.habittracker.mobile -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > emu/logcat-debug.txt
            grep -F "[privychki] native" emu/logcat-debug.txt | tail -3 || true
            grep -qF "[privychki] native ok" emu/logcat-debug.txt || { echo "Функции телефона (уведомления) не подключены"; exit 1; }
            grep -E "Capacitor/Console.*(Error|error)" emu/logcat-debug.txt | head -20 || true
            echo "OK: приложение запущено и работает"
      - name: Скриншот с эмулятора
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-check
          path: emu/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Privychki-android
          path: out/Privychki.apk
          retention-days: 90
      - name: AAB для Google Play
        if: hashFiles('play/Privychki.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Privychki-google-play
          path: play/Privychki.aab
          retention-days: 90
      - name: Выпуск (Releases) при теге v*
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Privychki.apk
            play/Privychki.aab
      - name: Итог проверки на эмуляторе
        if: steps.emulator.outcome != 'success'
        run: |
          echo "Проверка на эмуляторе Android не прошла — см. шаг «Запуск на эмуляторе Android»"
          exit 1
