const LS_KEY = 'habit-tracker-v1';

    const h = { id: 'demo' + n, name, category, timeOfDay, freq: 'daily', days: [], times: 3, ...freqObj, createdAt: created, archived: false, history: {} };
    const r = rng(n * 977);

    if (doneToday) h.history[keyOf(today)] = true;

/* ---------- Синхронизация с приложением на компьютере ---------- */
const isObj = x => x && typeof x === 'object' && !Array.isArray(x);
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
// Трёхстороннее слияние: base — последнее сохранённое, mine — здесь, theirs — с другого устройства
function merge3(base, mine, theirs) {
  if (same(mine, base)) return theirs;
  if (same(theirs, base) || same(mine, theirs)) return mine;
  if (isObj(mine) && isObj(theirs)) {
    const b = isObj(base) ? base : {}, out = {};
    for (const k of new Set([...Object.keys(theirs), ...Object.keys(mine)])) {
      const v = merge3(b[k], mine[k], theirs[k]);
      if (v !== undefined) out[k] = v;
    }
    return out;
  }
  const byId = a => Array.isArray(a) && a.every(x => isObj(x) && x.id);
  if (byId(mine) && byId(theirs)) {
    const idx = a => Object.fromEntries((byId(a) ? a : []).map(x => [x.id, x]));
    const B = idx(base), M = idx(mine), T = idx(theirs), out = [];
    for (const x of [...theirs, ...mine.filter(x => !T[x.id])]) {
      if (out.some(y => y.id === x.id)) continue;
      const v = merge3(B[x.id], M[x.id], T[x.id]);
      if (v !== undefined) out.push(v);
    }
    return out;
  }

}
const sync = (() => {
  const strip = s => { if (!s) return s; const { rev, saved, version, ...rest } = s; return rest; };

  async function send() {
    if (busy) { timer = setTimeout(send, 300); return; }
    timer = null; busy = true;
    const body = want;
    try {
      const r = await fetch('api/state', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ...body, rev }) });
      const j = await r.json().catch(() => ({}));
      if (r.status === 409 && j.state) {

const confetti = (() => {
  let canvas, ctx, parts = [], raf = null;
  const reduce = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function ensure() {
    if (canvas) return;
    canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%';
    document.body.appendChild(canvas);
    ctx = canvas.getContext('2d');
    const rs = () => { const r = window.devicePixelRatio || 1; canvas.width = innerWidth * r; canvas.height = innerHeight * r; ctx.setTransform(r, 0, 0, r, 0, 0); };
    rs(); addEventListener('resize', rs);
  }
  function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(p => p.life > 0);
    for (const p of parts) {
      p.vy += p.g; p.vx *= 0.986; p.vy *= 0.986; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life--;
      ctx.save(); ctx.globalAlpha = Math.min(1, p.life / 30); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.round) { ctx.beginPath(); ctx.arc(0, 0, p.s / 2.4, 0, 7); ctx.fill(); } else ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
    raf = parts.length ? requestAnimationFrame(loop) : null;
  }
  return (x, y, n, colors, power = 1) => {
    if (reduce()) return;
    ensure();
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (1.5 + Math.random() * 4.5) * power;
      parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2.5 * power, g: 0.16, s: 5 + Math.random() * 6,
        c: colors[i % colors.length], rot: Math.random() * 6, vr: (Math.random() - .5) * .35, life: 55 + Math.random() * 55, round: Math.random() < .3 });
    }
    if (!raf) raf = requestAnimationFrame(loop);
  };
})();

  const offToday = habits.filter(h => !h.archived && h.freq === 'days' && !h.days.includes(now.getDay()));
  let idx = 0;
  return (
    <div className="space-y-6">
      <ProgressCard done={done} total={total} />

        <div className={`${card} p-8 text-center fade-up`}>

        </div>
      )}
      {TIME_ORDER.map(t => {
        const group = items.filter(x => (x.h.timeOfDay || 'any') === t);
        if (!group.length) return null;
        const gd = group.filter(x => x.done).length;
        return (
          <section key={t}>
            <div className="flex items-center justify-between px-1 mb-2.5">

      {offToday.length > 0 && (
        <p className="px-1 text-xs text-zinc-400 dark:text-zinc-500">
          Сегодня не по плану: {offToday.map(h => h.name).join(', ')}

  );
}

const HEAT = ['bg-zinc-100 dark:bg-zinc-800', 'bg-emerald-100 dark:bg-emerald-900/70', 'bg-emerald-200 dark:bg-emerald-700/80', 'bg-emerald-300 dark:bg-emerald-500/90', 'bg-emerald-400 dark:bg-emerald-400'];

function StatsView({ habits, now }) {
  const active = habits.filter(h => !h.archived);
  const todayK = keyOf(now);
  const ratio = d => {
    const k = keyOf(d); let exp = 0, dn = 0;
    for (const h of active) {
      if (h.createdAt > k) continue;
      const did = !!h.history[k];
      if (h.freq === 'times') { exp += h.times / 7; if (did) dn++; }
      else if (isScheduledOn(h, d)) { exp++; if (did) dn++; }
    }
    return exp ? Math.min(1, dn / exp) : null;
  };
  const level = r => r == null ? 0 : r === 0 ? 0 : r < .34 ? 1 : r < .67 ? 2 : r < 1 ? 3 : 4;

  const WEEKS = 17;
  const start = addDays(startOfWeek(now), -(WEEKS - 1) * 7);
  const cols = [...Array(WEEKS)].map((_, w) => [...Array(7)].map((_, r) => addDays(start, w * 7 + r)));

  let totalDone = 0, sum = 0, cnt = 0;
  for (let i = 0; i < 30; i++) {
    const d = addDays(now, -i), k = keyOf(d);
    for (const h of active) if (h.history[k]) totalDone++;
    const r = ratio(d); if (r != null && i > 0) { sum += r; cnt++; }
  }
  const avg = cnt ? Math.round(sum / cnt * 100) : 0;
  let best = { n: 0, name: '—', unit: plural(0, ['день', 'дня', 'дней']) };
  for (const h of active) { const s = streak(h, now); if (s.n > best.n) best = { ...s, name: h.name }; }

  const stats = [
    { label: 'Баллы · 1 день = 1 балл', value: pointsOf(habits), icon: 'star', color: 'text-amber-500 bg-amber-50 dark:bg-amber-400/10' },
    { label: 'Средний уровень', value: avg + '%', icon: 'target', color: 'text-indigo-500 bg-indigo-50 dark:bg-indigo-400/10' },
    { label: L('Лучшая серия · {0}', best.name), value: `${best.n} ${best.unit}`, icon: 'flame', color: 'text-orange-500 bg-orange-50 dark:bg-orange-400/10' },
  ];

  return (
    <div className="space-y-6">
      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
        {stats.map((s, i) => (
          <div key={i} className={`${card} p-4 fade-up flex sm:block items-center gap-3`} style={{ animationDelay: i * 50 + 'ms' }}>
            <div className={`w-10 h-10 rounded-xl grid place-items-center shrink-0 ${s.color}`}><Icon name={s.icon} size={20} /></div>
            <div className="sm:mt-3 min-w-0">
              <div className="text-2xl font-bold tracking-tight tabular-nums">{s.value}</div>
              <div className="text-xs text-zinc-500 dark:text-zinc-400 truncate">{s.label}</div>
            </div>
          </div>
        ))}
      </div>

      <section className={`${card} p-5 sm:p-6 fade-up`}>
        <div className="flex items-center justify-between">
          <h2 className="font-semibold flex items-center gap-2"><Icon name="calendar" size={18} className="text-indigo-500" />Активность</h2>
          <span className="text-xs text-zinc-400">последние {WEEKS} недель</span>
        </div>
        <div className="mt-4 overflow-x-auto no-scrollbar">
          <div className="inline-flex gap-2 min-w-full justify-center">
            <div className="flex flex-col gap-[4px] pt-5 text-[10px] text-zinc-400 pr-1">
              {['Пн', '', 'Ср', '', 'Пт', '', 'Вс'].map((l, i) => <div key={i} className="h-[15px] leading-[15px]">{l}</div>)}
            </div>
            <div>
              <div className="flex gap-[4px] h-5 text-[10px] text-zinc-400">
                {cols.map((c, i) => {
                  const show = i === 0 || c[0].getMonth() !== cols[i - 1][0].getMonth();
                  return <div key={i} className="w-[15px] whitespace-nowrap overflow-visible">{show ? c[0].toLocaleDateString(LOC(), { month: 'short' }).replace('.', '') : ''}</div>;
                })}
              </div>
              <div className="flex gap-[4px]">
                {cols.map((c, i) => (
                  <div key={i} className="flex flex-col gap-[4px]">
                    {c.map(d => {
                      const k = keyOf(d);
                      if (k > todayK) return <div key={k} className="w-[15px] h-[15px]" />;
                      const r = ratio(d);
                      return <div key={k} title={`${d.toLocaleDateString(LOC(), { day: 'numeric', month: 'long' })}: ${r == null ? L('нет привычек') : Math.round(r * 100) + '%'}`}
                        className={`w-[15px] h-[15px] rounded-[4px] transition-transform hover:scale-125 ${HEAT[level(r)]} ${k === todayK ? 'ring-2 ring-indigo-400 ring-offset-1 ring-offset-white dark:ring-offset-zinc-900' : ''}`} />;
                    })}
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
        <div className="mt-4 flex items-center justify-end gap-1.5 text-[11px] text-zinc-400">
          Меньше {HEAT.map((c, i) => <span key={i} className={`w-3 h-3 rounded-[3px] ${c}`} />)} Больше
        </div>
      </section>

      <section className={`${card} p-5 sm:p-6 fade-up`}>
        <h2 className="font-semibold flex items-center gap-2"><Icon name="chart" size={18} className="text-indigo-500" />По привычкам · 30 дней</h2>

            const days = [...Array(30)].map((_, i) => addDays(now, i - 29));
            const n = days.filter(d => h.history[keyOf(d)]).length;
            return (
              <div key={h.id}>
                <div className="flex items-center justify-between gap-3 text-sm">
                  <span className="font-medium truncate flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full shrink-0" style={{ background: cat.hex }} />{h.name}</span>
                  <span className="shrink-0 text-xs text-zinc-500 tabular-nums flex items-center gap-2">
                    {n} за 30 дн
                    <span className="inline-flex items-center gap-0.5 text-orange-500 font-semibold"><Icon name="flame" size={13} fill="currentColor" fillOpacity={.25} />{st.n}</span>
                  </span>
                </div>
                <div className="mt-2 grid gap-[3px]" style={{ gridTemplateColumns: 'repeat(30, minmax(0, 1fr))' }}>
                  {days.map(d => {
                    const k = keyOf(d), did = !!h.history[k], before = k < h.createdAt, sch = isScheduledOn(h, d);
                    return <div key={k} title={d.toLocaleDateString(LOC(), { day: 'numeric', month: 'short' })}
                      className={`aspect-square rounded-[3px] ${did ? '' : before ? 'bg-transparent' : sch ? 'bg-zinc-200 dark:bg-zinc-700' : 'bg-zinc-100 dark:bg-zinc-800'}`}
                      style={did ? { background: cat.hex } : undefined} />;
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </section>
    </div>
  );
}

      </div>

        {['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => <button type="button" key={k} data-key={k} disabled={disabled} onClick={() => press(k)} className={key}>{k}</button>)}
        <span />
        <button type="button" data-key="0" disabled={disabled} onClick={() => press('0')} className={key}>0</button>
        <button type="button" data-key="del" disabled={disabled} onClick={() => press('del')} aria-label="Стереть" className={`${key} !bg-transparent text-zinc-500`}><Icon name="backspace" size={24} /></button>
      </div>

}
function PatternPad({ onDone, disabled }) {
  const [path, setPath] = useState([]);
  const [cur, setCur] = useState(null);
  const box = useRef(null), drawing = useRef(false), pathRef = useRef([]);
  const S = 264, P = [44, 132, 220];
  const pos = i => [P[i % 3], P[Math.floor(i / 3)]];
  const hit = e => {
    const r = box.current.getBoundingClientRect();
    const x = (e.clientX - r.left) * S / r.width, y = (e.clientY - r.top) * S / r.height;
    setCur([x, y]);
    for (let i = 0; i < 9; i++) {
      const [px, py] = pos(i);
      if (Math.hypot(x - px, y - py) < 32 && !pathRef.current.includes(i)) { pathRef.current = [...pathRef.current, i]; setPath(pathRef.current); }
    }
  };
  const down = e => {
    if (disabled) return;
    e.preventDefault(); drawing.current = true; pathRef.current = []; setPath([]);
    try { box.current.setPointerCapture(e.pointerId); } catch (x) {}
    hit(e);
  };
  const move = e => { if (drawing.current) hit(e); };
  const up = () => {
    if (!drawing.current) return;
    drawing.current = false; setCur(null);
    const p = pathRef.current;
    setTimeout(() => { if (!drawing.current) { pathRef.current = []; setPath([]); } }, 300);
    if (p.length) onDone(p.join(''));
  };
  const pts = path.map(pos);
  return (
    <svg ref={box} viewBox={`0 0 ${S} ${S}`} role="img" aria-label="Поле для рисунка" data-pattern
      onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up}
      className={`mx-auto w-64 h-64 select-none ${disabled ? 'opacity-40' : 'cursor-pointer'}`} style={{ touchAction: 'none' }}>
      <polyline points={[...pts, ...(cur && pts.length ? [cur] : [])].map(p => p.join(',')).join(' ')} fill="none" stroke="#6366f1" strokeWidth="6" strokeLinecap="round" strokeLinejoin="round" strokeOpacity=".7" />
      {[...Array(9)].map((_, i) => {
        const [x, y] = pos(i), on = path.includes(i);
        return <g key={i}>
          <circle cx={x} cy={y} r="26" fill={on ? '#6366f1' : 'currentColor'} fillOpacity={on ? .18 : .06} />
          <circle cx={x} cy={y} r={on ? 10 : 7} fill={on ? '#6366f1' : 'currentColor'} fillOpacity={on ? 1 : .35} />
        </g>;
      })}
    </svg>
  );
}
function LockSetup({ type, bioOn, onClose, onSave }) {

    onSave(makeLock(type, secret, bioOn));
  };
  const title = type === 'pin' ? (first == null ? 'Придумайте код' : 'Повторите код') : (first == null ? 'Нарисуйте рисунок' : 'Повторите рисунок');
  return (

              <button type="button" disabled={pin.length < 4} onClick={() => take(pin)} className="mt-6 w-full rounded-2xl bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 text-white py-3.5 font-semibold transition">{first == null ? 'Далее' : 'Сохранить'}</button>

}
function LockScreen({ cfg, onUnlock, alarm }) {
  const [pin, setPin] = useState('');
  const [err, setErr] = useState('');
  const [fails, setFails] = useState(0);
  const [wait, setWait] = useState(0);
  const [reset, setReset] = useState(false);
  const [bioOk, setBioOk] = useState(false);
  const tryBio = async () => { if (await bio.verify()) onUnlock(); };
  useEffect(() => {
    if (!cfg.bio) return;
    let live = true;
    bio.check().then(r => { if (live && r.ok) { setBioOk(true); tryBio(); } });
    return () => { live = false; };
  }, []);
  useEffect(() => {
    if (wait <= 0) return;
    const i = setTimeout(() => setWait(w => w - 1), 1000);
    return () => clearTimeout(i);
  }, [wait]);
  const check = secret => {
    if (wait > 0) return;
    if (lockHash(cfg.salt, secret) === cfg.hash) return onUnlock();
    const f = fails + 1;
    setFails(f); setPin(''); setErr(cfg.type === 'pin' ? 'Неверный код' : 'Неверный рисунок');
    if (f % 5 === 0) setWait(30);
  };
  const onPin = v => { setErr(''); setPin(v); if (v.length >= cfg.len) check(v); };
  const wipe = () => {
    try { [LS_KEY, LOCK_KEY, MELODY_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.reload();
  };
  return (
    <div className="fixed inset-0 z-[80] overflow-y-auto bg-[#f5f5f7] dark:bg-black" data-lock-screen>
      <div className="min-h-full flex flex-col items-center justify-center px-6 py-10">
        <div className="w-14 h-14 rounded-2xl grid place-items-center bg-indigo-500 text-white shadow-[0_12px_28px_-8px_rgba(99,102,241,.9)]"><Icon name="lock" size={26} /></div>
        <h1 className="mt-4 text-2xl font-extrabold tracking-tight">Привычки</h1>
        <p className={`mt-1 mb-7 text-sm min-h-[1.25rem] text-center ${err || wait > 0 ? 'text-rose-500' : 'text-zinc-500 dark:text-zinc-400'}`}>
          {wait > 0 ? L('Слишком много попыток. Подождите {0} с', wait) : err || (cfg.type === 'pin' ? 'Введите код' : 'Нарисуйте рисунок для входа')}
        </p>
        {alarm && <p className="-mt-4 mb-6 flex items-center gap-1.5 text-sm font-semibold text-amber-500"><Icon name="alarm" size={16} />Сработал будильник</p>}
        {cfg.type === 'pin' ? <PinPad value={pin} onChange={onPin} max={cfg.len} disabled={wait > 0} /> : <PatternPad onDone={check} disabled={wait > 0} />}
        {bioOk && <button type="button" onClick={tryBio} className="mt-7 inline-flex items-center gap-2 rounded-full bg-white dark:bg-zinc-900 ring-1 ring-black/5 dark:ring-white/10 px-5 py-2.5 text-sm font-semibold transition active:scale-95"><Icon name="shield" size={17} className="text-indigo-500" />Войти по биометрии</button>}
        {!reset
          ? <button type="button" onClick={() => setReset(true)} className="mt-7 text-xs text-zinc-400 underline underline-offset-2">Забыли код?</button>
          : <div className="mt-7 w-full max-w-xs rounded-2xl bg-white dark:bg-zinc-900 ring-1 ring-rose-200 dark:ring-rose-500/30 p-4 text-center fade-in">
              <p className="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed">Сбросить приложение? Все привычки, отметки и лекарства на этом устройстве будут удалены.</p>
              <button type="button" onClick={wipe} className="mt-3 w-full rounded-xl bg-rose-500 hover:bg-rose-600 text-white py-2.5 text-sm font-semibold transition">Сбросить и удалить данные</button>
              <button type="button" onClick={() => setReset(false)} className="mt-1 w-full rounded-xl py-2.5 text-sm font-semibold text-zinc-500">Отмена</button>
            </div>}
      </div>
    </div>
  );
}

function MedSheet({ initial, onClose, onSave, onDelete }) {
  const [name, setName] = useState(initial ? initial.name : '');
  const [dose, setDose] = useState(initial ? initial.dose : L('1 таблетка'));
  const [note, setNote] = useState(initial ? initial.note || '' : '');
  const [times, setTimes] = useState(initial ? initial.times : ['08:00']);
  const [every, setEvery] = useState(!initial || !initial.days || !initial.days.length);
  const [days, setDays] = useState(initial && initial.days && initial.days.length ? initial.days : [1, 2, 3, 4, 5]);
  const [alarm, setAlarm] = useState(initial ? initial.alarm : true);
  const [snd, setSnd] = useState(initial ? initial.sound || '' : '');
  const [color, setColor] = useState(initial ? initial.color : PALETTE[3]);
  const [err, setErr] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, []);
  const submit = e => {
    e.preventDefault();
    if (!name.trim()) return setErr('Введите название лекарства');
    const ts = [...new Set(times.filter(Boolean))].sort();
    if (!ts.length) return setErr('Добавьте хотя бы одно время приёма');
    if (!every && !days.length) return setErr('Выберите дни недели');
    sound.unlock();
    onSave({ ...(initial || {}), name: name.trim().slice(0, 60), dose: dose.trim() || L('1 таблетка'), note: note.trim().slice(0, 80), times: ts, days: every ? [] : days, alarm, sound: snd, color });
  };
  const label = 'block text-xs font-semibold uppercase tracking-wide text-zinc-400 mb-2';
  const field = 'w-full rounded-2xl bg-zinc-100 dark:bg-zinc-800 px-4 py-3 text-[16px] outline-none ring-2 ring-transparent focus:ring-violet-300 dark:focus:ring-violet-500/60 transition placeholder:text-zinc-400';
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div className="fade-in absolute inset-0 bg-black/30 dark:bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <form onSubmit={submit} role="dialog" aria-modal="true" aria-label="Лекарство"
        className="sheet-in relative w-full sm:max-w-md max-h-[92vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] bg-white dark:bg-zinc-900 p-6 pb-8 shadow-2xl">
        <div className="sm:hidden mx-auto -mt-2 mb-4 h-1.5 w-10 rounded-full bg-zinc-200 dark:bg-zinc-700" />
        <div className="flex items-center justify-between">
          <h2 className="text-xl font-bold tracking-tight">{initial ? 'Лекарство' : 'Новое лекарство'}</h2>
          <button type="button" onClick={onClose} aria-label="Закрыть" className="w-9 h-9 rounded-full grid place-items-center bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 transition"><Icon name="x" size={18} /></button>
        </div>

        <div className="mt-5">
          <label className={label} htmlFor="mname">Название</label>
          <input id="mname" value={name} onChange={e => { setName(e.target.value); setErr(''); }} maxLength={60} placeholder="Например, «Витамин D»" className={field} />
        </div>
        <div className="mt-4 grid grid-cols-2 gap-3">
          <div>
            <label className={label} htmlFor="mdose">Дозировка</label>
            <input id="mdose" value={dose} onChange={e => setDose(e.target.value)} maxLength={30} placeholder="1 таблетка" className={field} />
          </div>
          <div>
            <label className={label} htmlFor="mnote">Заметка</label>
            <input id="mnote" value={note} onChange={e => setNote(e.target.value)} maxLength={80} placeholder="после еды" className={field} />
          </div>
        </div>

        <div className="mt-5">
          <span className={label}>Время приёма</span>
          <div className="space-y-2">
            {times.map((t, i) => (
              <div key={i} className="flex items-center gap-2">
                <input type="time" value={t} onChange={e => { const v = e.target.value; setTimes(s => s.map((x, j) => j === i ? v : x)); setErr(''); }} className={`${field} tabular-nums`} aria-label={L('Время {0}', i + 1)} />
                {times.length > 1 && <button type="button" onClick={() => setTimes(s => s.filter((_, j) => j !== i))} aria-label="Убрать время" className="w-11 h-11 shrink-0 rounded-full grid place-items-center bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-rose-500 transition"><Icon name="x" size={18} /></button>}
              </div>
            ))}
          </div>
          {times.length < 6 && <button type="button" onClick={() => setTimes(s => [...s, s.length ? (toMin(s[s.length - 1]) + 240 < 1440 ? `${pad(Math.floor((toMin(s[s.length - 1]) + 240) / 60))}:${pad((toMin(s[s.length - 1]) + 240) % 60)}` : '21:00') : '08:00'])}
            className="mt-2 text-sm font-semibold text-violet-500 hover:text-violet-600 flex items-center gap-1"><Icon name="plus" size={16} />Ещё время</button>}
        </div>

        <div className="mt-5">
          <span className={label}>Дни</span>
          <div className="grid grid-cols-2 gap-1 rounded-2xl bg-zinc-100 dark:bg-zinc-800 p-1">
            {[[true, 'Каждый день'], [false, 'По дням']].map(([v, l]) => (
              <button type="button" key={l} onClick={() => setEvery(v)} className={`rounded-xl py-2 text-sm font-medium transition ${every === v ? 'bg-white dark:bg-zinc-700 shadow-sm' : 'text-zinc-500'}`}>{l}</button>
            ))}
          </div>
          {!every && (
            <div className="mt-3 flex justify-between gap-1 fade-in">
              {WD_ORDER.map(d => {
                const on = days.includes(d);
                return <button type="button" key={d} onClick={() => setDays(s => on ? s.filter(x => x !== d) : [...s, d])}
                  className={`w-10 h-10 rounded-full text-sm font-semibold transition active:scale-90 ${on ? 'bg-violet-500 text-white' : 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400'}`}>{WD[d]}</button>;
              })}
            </div>
          )}
        </div>

        <div className="mt-5 flex items-center justify-between rounded-2xl bg-zinc-100 dark:bg-zinc-800 px-4 py-3">
          <span className="flex items-center gap-2 text-sm font-medium"><Icon name="alarm" size={18} className="text-amber-500" />Будильник</span>
          <Switch on={alarm} onChange={setAlarm} label="Будильник для этого лекарства" />
        </div>
        {alarm && <div className="mt-3 fade-in"><span className={label}>Мелодия</span><SoundPicker value={snd} onChange={setSnd} allowDefault /></div>}

        <div className="mt-5">
          <span className={label}>Цвет</span>
          <div className="flex gap-2.5">
            {PALETTE.map(c => (
              <button type="button" key={c} onClick={() => setColor(c)} aria-label={L('Цвет {0}', c)}
                className={`w-9 h-9 rounded-full transition ${color === c ? 'ring-4 ring-offset-2 ring-offset-white dark:ring-offset-zinc-900' : ''}`} style={{ background: c, '--tw-ring-color': c + '66' }} />
            ))}
          </div>
        </div>

        {err && <p className="mt-4 text-sm text-rose-500 fade-in">{err}</p>}
        <button type="submit" className="mt-6 w-full rounded-2xl bg-violet-500 hover:bg-violet-600 active:scale-[.98] text-white py-3.5 font-semibold transition">
          {initial ? 'Сохранить' : 'Добавить в расписание'}
        </button>
        {initial && (
          <button type="button" onClick={() => confirmDel ? onDelete(initial.id) : setConfirmDel(true)}
            className={`mt-2 w-full rounded-2xl py-3 text-sm font-semibold transition ${confirmDel ? 'bg-rose-500 text-white' : 'text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-500/10'}`}>
            {confirmDel ? 'Точно удалить?' : 'Удалить лекарство'}
          </button>
        )}
      </form>
    </div>
  );
}

function AlarmModal({ items, onTake, onSnooze, onStop }) {

  return (
    <div className="fixed inset-0 z-[65] flex items-center justify-center p-5">

        <div className="mx-auto w-16 h-16 rounded-full grid place-items-center bg-amber-100 text-amber-500 dark:bg-amber-400/15 flame"><Icon name="alarm" size={32} /></div>
        <h3 className="mt-3 text-center text-xl font-extrabold tracking-tight">{meds ? 'Пора принять' : 'Напоминание'}</h3>

            <div key={d.key} className="rounded-2xl bg-zinc-50 dark:bg-zinc-800 p-3.5">

                <div className="min-w-0 flex-1">
                  <div className="font-semibold truncate" dir="auto">{d.title}</div>

                </div>
              </div>
              <div className="mt-3 grid grid-cols-2 gap-2">
                <button onClick={() => onSnooze(d)} className="rounded-xl bg-white dark:bg-zinc-700 ring-1 ring-black/5 dark:ring-white/10 py-2.5 text-sm font-semibold transition active:scale-95">Через 10 мин</button>
                <button onClick={() => onTake(d)} className="rounded-xl text-white py-2.5 text-sm font-semibold transition active:scale-95" style={{ background: d.color }}>{d.kind === 'med' ? 'Принял(а)' : 'Выполнено'}</button>

    <div className={`${card} p-8 text-center fade-up`}>
      <div className="mx-auto w-14 h-14 rounded-2xl grid place-items-center bg-zinc-100 text-zinc-400 dark:bg-zinc-800"><Icon name="archive" size={26} /></div>
      <p className="mt-4 font-semibold">Архив пуст</p>

  );
  return (
    <div className="space-y-2.5">

        const cat = CATS[h.category] || CATS.health;
        const total = Object.keys(h.history).length;

            <div className="min-w-0 flex-1">
              <div className="font-semibold truncate">{h.name}</div>
              <div className="text-xs text-zinc-400">{cat.label} · {freqText(h)} · {total} {plural(total, ['отметка', 'отметки', 'отметок'])}</div>
            </div>
            <button onClick={() => onRestore(h.id)} title="Вернуть" aria-label="Вернуть из архива" className="w-9 h-9 rounded-full grid place-items-center text-indigo-500 hover:bg-indigo-50 dark:hover:bg-indigo-400/10 transition"><Icon name="restore" size={18} /></button>
            {confirm === h.id
              ? <button onClick={() => onDelete(h.id)} className="rounded-full bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold px-3 py-2 transition">Удалить?</button>
              : <button onClick={() => setConfirm(h.id)} title="Удалить" aria-label="Удалить" className="w-9 h-9 rounded-full grid place-items-center text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10 transition"><Icon name="trash" size={18} /></button>}
          </div>
        );
      })}
    </div>

}

function HabitSheet({ initial, onClose, onSave }) {
  const [name, setName] = useState(initial ? initial.name : '');
  const [category, setCategory] = useState(initial ? initial.category || 'health' : 'health');
  const [freq, setFreq] = useState(initial ? initial.freq || 'daily' : 'daily');
  const [days, setDays] = useState(initial && initial.days && initial.days.length ? initial.days : [1, 3, 5]);
  const [times, setTimes] = useState(initial ? initial.times || 3 : 3);
  const [tod, setTod] = useState(initial ? initial.timeOfDay || 'any' : 'any');
  const [remindOn, setRemindOn] = useState(!!(initial && initial.remind));
  const [remind, setRemind] = useState(initial && initial.remind ? initial.remind : '09:00');
  const [snd, setSnd] = useState(initial ? initial.sound || '' : '');
  const [err, setErr] = useState('');
  const input = useRef(null);
  useEffect(() => {
    if (!initial) setTimeout(() => input.current && input.current.focus(), 80);
    const k = e => { if (e.key === 'Escape') onClose(); };
    addEventListener('keydown', k); return () => removeEventListener('keydown', k);
  }, []);
  const submit = e => {
    e.preventDefault();
    if (!name.trim()) return setErr('Введите название привычки');
    if (freq === 'days' && !days.length) return setErr('Выберите хотя бы один день недели');
    sound.unlock();
    onSave({ ...(initial ? { id: initial.id } : {}), name: name.trim().slice(0, 60), category, freq, days: freq === 'days' ? days : [], times, timeOfDay: tod,
      remind: remindOn && remind ? remind : '', sound: snd });
  };
  const label = LBL;
  return (
    <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
      <div className="fade-in absolute inset-0 bg-black/30 dark:bg-black/60 backdrop-blur-sm" onClick={onClose} />
      <form onSubmit={submit} role="dialog" aria-modal="true" aria-label={initial ? 'Привычка' : 'Новая привычка'}
        className="sheet-in relative w-full sm:max-w-md max-h-[92vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] bg-white dark:bg-zinc-900 p-6 pb-8 shadow-2xl">
        <div className="sm:hidden mx-auto -mt-2 mb-4 h-1.5 w-10 rounded-full bg-zinc-200 dark:bg-zinc-700" />
        <div className="flex items-center justify-between">
          <h2 className="text-xl font-bold tracking-tight">{initial ? 'Привычка' : 'Новая привычка'}</h2>
          <button type="button" onClick={onClose} aria-label="Закрыть" className="w-9 h-9 rounded-full grid place-items-center bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 transition"><Icon name="x" size={18} /></button>
        </div>

        <div className="mt-5">
          <label className={label} htmlFor="hname">Название</label>
          <input id="hname" ref={input} value={name} onChange={e => { setName(e.target.value); setErr(''); }} maxLength={60} dir="auto"
            placeholder="Например, «Пройти 8 000 шагов»"
            className="w-full rounded-2xl bg-zinc-100 dark:bg-zinc-800 px-4 py-3.5 text-[16px] outline-none ring-2 ring-transparent focus:ring-indigo-300 dark:focus:ring-indigo-500/60 transition placeholder:text-zinc-400" />
        </div>

        <div className="mt-5">
          <span className={label}>Категория</span>
          <div className="flex flex-wrap gap-2">
            {Object.entries(CATS).map(([k, c]) => (
              <Pill key={k} active={category === k} color={c.hex} onClick={() => setCategory(k)}><Icon name={c.icon} size={15} />{c.label}</Pill>
            ))}
          </div>
        </div>

        <div className="mt-5">
          <span className={label}>Частота</span>
          <div className="grid grid-cols-3 gap-1 rounded-2xl bg-zinc-100 dark:bg-zinc-800 p-1">
            {[['daily', 'Ежедневно'], ['days', 'По дням'], ['times', 'X раз/нед']].map(([k, l]) => (
              <button type="button" key={k} onClick={() => { setFreq(k); setErr(''); }}
                className={`rounded-xl py-2 text-sm font-medium transition ${freq === k ? 'bg-white dark:bg-zinc-700 shadow-sm' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200'}`}>{l}</button>
            ))}
          </div>
          {freq === 'days' && (
            <div className="mt-3 flex justify-between gap-1 fade-in">
              {WD_ORDER.map(d => {
                const on = days.includes(d);
                return <button type="button" key={d} onClick={() => { setDays(s => on ? s.filter(x => x !== d) : [...s, d]); setErr(''); }}
                  className={`w-10 h-10 rounded-full text-sm font-semibold transition active:scale-90 ${on ? 'bg-indigo-500 text-white shadow-sm' : 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-700'}`}>{WD[d]}</button>;
              })}
            </div>
          )}
          {freq === 'times' && (
            <div className="mt-3 flex items-center justify-between rounded-2xl bg-zinc-100 dark:bg-zinc-800 px-4 py-2.5 fade-in">
              <span className="text-sm text-zinc-600 dark:text-zinc-300">Раз в неделю</span>
              <div className="flex items-center gap-3">
                <button type="button" aria-label="Меньше" onClick={() => setTimes(n => Math.max(1, n - 1))} className="w-8 h-8 rounded-full grid place-items-center bg-white dark:bg-zinc-700 shadow-sm active:scale-90 transition"><Icon name="minus" size={16} /></button>
                <span className="w-5 text-center font-bold tabular-nums">{times}</span>
                <button type="button" aria-label="Больше" onClick={() => setTimes(n => Math.min(6, n + 1))} className="w-8 h-8 rounded-full grid place-items-center bg-white dark:bg-zinc-700 shadow-sm active:scale-90 transition"><Icon name="plus" size={16} /></button>
              </div>

        <div className="mt-5">
          <span className={label}>Время суток</span>

                className={`flex flex-col items-center gap-1 rounded-2xl py-2.5 text-xs font-medium transition active:scale-95 ${tod === k ? 'bg-zinc-900 text-white dark:bg-white dark:text-zinc-900' : 'bg-zinc-100 text-zinc-500 dark:bg-zinc-800 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-zinc-700'}`}>
                <Icon name={TIMES[k].icon} size={18} />{k === 'any' ? 'Любое' : TIMES[k].label}
              </button>
            ))}
          </div>
        </div>

        <div className="mt-5">
          <div className="flex items-center justify-between gap-3 rounded-2xl bg-zinc-100 dark:bg-zinc-800 px-4 py-3">
            <span className="min-w-0">
              <span className="flex items-center gap-2 text-sm font-medium"><Icon name="alarm" size={18} className="text-amber-500" />Будильник</span>
              <span className="block text-xs text-zinc-500 dark:text-zinc-400">Напомнить в назначенное время</span>
            </span>
            <Switch on={remindOn} onChange={v => { sound.unlock(); setRemindOn(v); }} label="Будильник" />
          </div>
          {remindOn && (
            <div className="mt-3 space-y-3 fade-in">
              <div>
                <label className={label} htmlFor="hremind">Время</label>
                <input id="hremind" type="time" value={remind} onChange={e => setRemind(e.target.value)} className={`${FIELD} tabular-nums`} />
              </div>
              <div>
                <span className={label}>Мелодия</span>
                <SoundPicker value={snd} onChange={setSnd} allowDefault />
              </div>
            </div>
          )}
        </div>

        {err && <p className="mt-4 text-sm text-rose-500 fade-in">{err}</p>}
        <button type="submit" className="mt-6 w-full rounded-2xl bg-indigo-500 hover:bg-indigo-600 active:scale-[.98] text-white py-3.5 font-semibold transition shadow-[0_10px_24px_-10px_rgba(99,102,241,.8)]">
          {initial ? 'Сохранить' : 'Добавить привычку'}
        </button>
      </form>
    </div>
  );
}

/* ---------- Приложение ---------- */
function PrivacySheet({ onClose }) {
  useEffect(() => {
    const k = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k);
    return () => window.removeEventListener('keydown', k);
  }, []);
  const H = ({ children }) => <h3 className="mt-5 font-semibold text-zinc-900 dark:text-zinc-100">{children}</h3>;
  return (
    <div className="fixed inset-0 z-[60] flex items-end sm:items-center justify-center">
      <div className="fade-in absolute inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose} />
      <div role="dialog" aria-modal="true" aria-label="Политика конфиденциальности"
        className="sheet-in relative w-full sm:max-w-md max-h-[88vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] bg-white dark:bg-zinc-900 p-6 shadow-2xl"
        style={{ paddingBottom: 'calc(1.5rem + env(safe-area-inset-bottom))' }}>
        <div className="flex items-center justify-between gap-4">
          <h2 className="text-xl font-bold tracking-tight">Политика конфиденциальности</h2>
          <button onClick={onClose} aria-label="Закрыть" className="w-9 h-9 shrink-0 rounded-full grid place-items-center bg-zinc-100 dark:bg-zinc-800 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200 transition"><Icon name="x" size={18} /></button>
        </div>
        <div className="mt-2 text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed">
          <p>Действует с 15 ноября 2026 года. Относится к приложению «Привычки».</p>
          <H>Какие данные хранятся</H>
          <p>Ваши привычки, отметки о выполнении, список лекарств, время приёма и настройки. Всё это хранится только на вашем устройстве.</p>
          <H>Что мы не делаем</H>
          <p>Мы не собираем, не отправляем на серверы и не передаём третьим лицам ваши данные. В приложении нет регистрации, рекламы и аналитики.</p>
          <H>Разрешения</H>
          <p>Уведомления и будильники нужны только для напоминаний о привычках и приёме лекарств. Запуск после перезагрузки нужен, чтобы восстановить запланированные напоминания. Биометрия (Face ID, отпечаток) используется только для входа в приложение и обрабатывается самим устройством.</p>
          <H>Удаление данных</H>
          <p>Удалить данные можно в самом приложении или удалив приложение с устройства. Восстановить их после этого нельзя: копий у нас нет.</p>
          <H>Медицинская оговорка</H>
          <p>Приложение не является медицинским изделием и не даёт медицинских рекомендаций.</p>
          <H>Контакты</H>
          <p>Вопросы о конфиденциальности: <a href="mailto:HabitTrackerContacts@gmail.com" className="text-indigo-500 underline underline-offset-2">HabitTrackerContacts@gmail.com</a>.</p>
        </div>
      </div>
    </div>
  );
}

function App() {
  const [state, setState] = useState(load);
  LANG = LANGS[state.lang] ? state.lang : 'ru';
  DEFAULT_SOUND = state.sound || 'classic';
  const [showPrivacy, setShowPrivacy] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const { habits, theme } = state;
  const [tab, setTab] = useState('today');
  const [habitSheet, setHabitSheet] = useState(null); // null | 'new' | привычка
  const [newMedal, setNewMedal] = useState(null);
  const [medSheet, setMedSheet] = useState(null); // null | 'new' | med
  const [ringing, setRinging] = useState([]);
  const [now, setNow] = useState(new Date());
  const [lock, setLock] = useState(() => LOCAL ? null : lockStore.get());
  const [locked, setLocked] = useState(() => !LOCAL && !!lockStore.get());
  const meds = state.meds || [], medLog = state.medLog || {}, alarmsOn = state.alarmsOn !== false;

  // Будильник: проверяем расписание лекарств и привычек каждые 10 секунд
  const stRef = useRef(state); stRef.current = state;
  const fired = useRef(new Set());
  const snoozes = useRef({});
  useEffect(() => {
    const tick = () => {
      const s = stRef.current;
      if (s.alarmsOn === false) return;
      const d = new Date(), k = keyOf(d), hm = hmOf(d), due = [];
      const consider = (dk, tm, make) => {
        const eff = snoozes.current[`${k}|${dk}`] || tm, fk = `${k}|${dk}|${eff}`;
        const late = toMin(hm) - toMin(eff);
        if (late >= 0 && late <= 30 && !fired.current.has(fk)) { fired.current.add(fk); due.push(make()); }
      };
      for (const m of s.meds || []) {
        if (!m.alarm || !medToday(m, d)) continue;
        for (const tm of m.times) {
          const dk = `${m.id}@${tm}`;
          if (s.medLog && s.medLog[k] && s.medLog[k][dk]) continue;
          consider(dk, tm, () => ({ kind: 'med', key: dk, time: tm, title: m.name, sub: [m.dose, m.note].filter(Boolean).join(' · '), color: m.color, sound: m.sound || '' }));
        }
      }
      for (const h of s.habits || []) {
        if (!habitDueOn(h, d)) continue;
        const cat = CATS[h.category] || CATS.health;
        consider('h:' + h.id, h.remind, () => ({ kind: 'habit', key: 'h:' + h.id, id: h.id, time: h.remind, title: h.name, sub: cat.label, color: cat.hex, sound: h.sound || '' }));
      }
      if (due.length) setRinging(r => [...r.filter(x => !due.some(y => y.key === x.key)), ...due]);
    };
    tick();
    const i = setInterval(tick, 10000);
    const vis = () => { if (!document.hidden) tick(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(i); document.removeEventListener('visibilitychange', vis); };
  }, []);
  const ringSound = ringing.length ? (ringing[0].sound || state.sound || 'classic') : null;
  useEffect(() => {
    if (!ringSound) return;
    const title = document.title;
    let n = 0;
    sound.start(ringSound);
    const ring = () => {
      n++;
      if (n <= 60 && navigator.vibrate) try { navigator.vibrate([300, 150, 300]); } catch (e) {}
      document.title = n % 2 ? L('⏰ Напоминание') : title;
    };
    ring();
    const i = setInterval(ring, 1500);
    return () => { clearInterval(i); sound.stop(); document.title = title; };
  }, [ringSound]);

  useEffect(() => {
    const upd = () => setNow(new Date());
    const t = setInterval(upd, 30000);
    document.addEventListener('visibilitychange', upd);
    return () => { clearInterval(t); document.removeEventListener('visibilitychange', upd); };
  }, []);
  // приложение для компьютера: изменения с другого устройства (iPhone) приходят сюда
  useEffect(() => { sync.onRemote = s => setState(normalize(s)); return () => { sync.onRemote = null; }; }, []);
  useEffect(() => { save(state); }, [state]);
  useEffect(() => { notify.plan(state); }, [state.meds, state.medLog, state.alarmsOn, state.habits, state.lang]);
  useEffect(() => {
    if (!notify.available) return;
    const vis = () => { if (!document.hidden) notify.plan(stRef.current); };
    document.addEventListener('visibilitychange', vis);
    return () => document.removeEventListener('visibilitychange', vis);
  }, []);
  useEffect(() => {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const apply = () => document.documentElement.classList.toggle('dark', theme === 'dark' || (theme === 'auto' && mq.matches));
    apply();
    mq.addEventListener && mq.addEventListener('change', apply);
    return () => mq.removeEventListener && mq.removeEventListener('change', apply);
  }, [theme]);
  useEffect(() => { document.documentElement.lang = LANG; document.documentElement.dir = LANGS[LANG].dir; }, [state.lang]);
  // защита входа: снова спрашиваем код, если приложение было свёрнуто дольше 30 секунд
  useEffect(() => {
    let hiddenAt = 0;
    const vis = () => {
      if (document.hidden) hiddenAt = Date.now();
      else if (hiddenAt && Date.now() - hiddenAt > 30000 && !LOCAL && lockStore.get()) setLocked(true);
    };
    document.addEventListener('visibilitychange', vis);
    return () => document.removeEventListener('visibilitychange', vis);
  }, []);
  const changeLock = cfg => { lockStore.set(cfg); setLock(cfg); };

  const setHabits = fn => setState(s => ({ ...s, habits: fn(s.habits) }));
  const todayK = keyOf(now);

  const toggle = (id, el) => {
    const h = habits.find(x => x.id === id); if (!h) return;
    const willDone = !h.history[todayK];
    const next = habits.map(x => {
      if (x.id !== id) return x;
      const history = { ...x.history };
      if (willDone) history[todayK] = true; else delete history[todayK];
      return { ...x, history };
    });
    setHabits(() => next);
    if (willDone) {
      const cat = CATS[h.category] || CATS.health;
      if (el) { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 22, [cat.hex, '#fbbf24', '#ffffff', cat.hex], 0.8); }
      const before = Math.max(pointsOf(habits), state.medalSeen || 0), after = pointsOf(next);
      const earned = [...MEDALS].reverse().find(m => m > before && m <= after);
      if (earned) setState(s => ({ ...s, medalSeen: Math.max(s.medalSeen || 0, earned) }));
      const p = dayProgress(todayItems(next, now));
      if (earned) {
        setTimeout(() => { setNewMedal(earned); confetti(innerWidth / 2, innerHeight * 0.3, 190, ['#fbbf24', '#f59e0b', '#fde68a', ...PALETTE], 1.8); }, 300);
      } else if (p.total > 0 && p.done === p.total) setTimeout(() => confetti(innerWidth / 2, innerHeight * 0.35, 170, PALETTE, 1.7), 250);
      if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
    }
  };
  const archive = id => setHabits(hs => hs.map(h => h.id === id ? { ...h, archived: true } : h));
  const restore = id => setHabits(hs => hs.map(h => h.id === id ? { ...h, archived: false } : h));
  const remove = id => setHabits(hs => hs.filter(h => h.id !== id));
  const saveHabit = data => {
    if (data.id) setHabits(hs => hs.map(h => h.id === data.id ? { ...h, ...data } : h));
    else { setHabits(hs => [...hs, { id: uid(), ...data, createdAt: todayK, archived: false, history: {} }]); setTab('today'); }
    setHabitSheet(null);
  };
  const takeMed = key => setState(s => {
    const d = new Date(), k = keyOf(d);
    const log = { ...(s.medLog || {}) }, day = { ...(log[k] || {}) };
    if (day[key]) delete day[key]; else day[key] = hmOf(d);
    log[k] = day;
    return { ...s, medLog: log };
  });
  const takeFromAlarm = item => {
    const k = keyOf(new Date());
    if (item.kind === 'habit') { const h = habits.find(x => x.id === item.id); if (h && !h.history[k]) toggle(h.id); }
    else if (!(medLog[k] && medLog[k][item.key])) takeMed(item.key);
    setRinging(r => r.filter(x => x.key !== item.key));
  };
  const snooze = item => {
    const d = new Date(Date.now() + 10 * 60000);
    snoozes.current[`${keyOf(new Date())}|${item.key}`] = keyOf(d) === keyOf(new Date()) ? hmOf(d) : '23:59';
    notify.snooze(item.kind === 'med' ? L('Пора принять лекарство') : L('Напоминание о привычке'),
      `${item.time} · ${item.title}${item.kind === 'med' && item.sub ? ' · ' + item.sub : ''}`, d);
    setRinging(r => r.filter(x => x.key !== item.key));
  };
  const saveMed = m => {
    setState(s => {
      const list = s.meds || [];
      return { ...s, meds: m.id ? list.map(x => x.id === m.id ? m : x) : [...list, { ...m, id: uid() }] };
    });
    setMedSheet(null);
  };
  const deleteMed = id => { setState(s => ({ ...s, meds: (s.meds || []).filter(x => x.id !== id) })); setMedSheet(null); };
  const openNew = () => tab === 'pills' ? setMedSheet('new') : setHabitSheet('new');

  if (locked && lock) return <LockScreen cfg={lock} alarm={ringing.length > 0} onUnlock={() => setLocked(false)} />;

  const hour = now.getHours();
  const greeting = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
  const dateStr = now.toLocaleDateString(LOC(), { weekday: 'long', day: 'numeric', month: 'long' });
  const archivedCount = habits.filter(h => h.archived).length;
  const tabs = [['today', 'Сегодня', 'listChecks'], ['pills', 'Таблетки', 'pill'], ['medals', 'Медали', 'medal'], ['stats', 'Статистика', 'chart'], ['archive', 'Архив', 'archive']];
  const points = pointsOf(habits);

  return (
    <div className="min-h-screen">
      <div className="mx-auto max-w-2xl px-4 sm:px-6 pt-6 sm:pt-12 pb-32">
        <header className="flex items-start justify-between gap-4">
          <div className="min-w-0">
            <p className="text-sm font-medium text-zinc-400 dark:text-zinc-500 first-letter:uppercase">{dateStr}</p>
            <h1 className="mt-0.5 text-3xl sm:text-4xl font-extrabold tracking-tight">{greeting}</h1>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            <button onClick={openNew} className={`hidden sm:inline-flex items-center gap-2 rounded-full text-white px-4 h-10 text-sm font-semibold transition active:scale-95 shadow-[0_8px_20px_-8px_rgba(99,102,241,.8)] ${tab === 'pills' ? 'bg-violet-500 hover:bg-violet-600' : 'bg-indigo-500 hover:bg-indigo-600'}`}>
              <Icon name="plus" size={18} stroke={2.5} />{tab === 'pills' ? 'Лекарство' : 'Новая привычка'}
            </button>
            <button onClick={() => setTab('medals')} title="Баллы за активность" aria-label={L('Баллы: {0}', points)}
              className="h-10 rounded-full inline-flex items-center gap-1.5 px-3 bg-white dark:bg-zinc-900 ring-1 ring-black/5 dark:ring-white/10 font-bold tabular-nums hover:scale-105 active:scale-95 transition">
              <Icon name="star" size={18} className="text-amber-400" fill="currentColor" />{points}
            </button>
            <button onClick={() => setShowSettings(true)} title="Настройки" aria-label="Настройки"
              className="w-10 h-10 rounded-full grid place-items-center bg-white dark:bg-zinc-900 ring-1 ring-black/5 dark:ring-white/10 text-zinc-600 dark:text-zinc-300 hover:scale-105 active:scale-95 transition">
              <Icon name="settings" size={18} />
            </button>
          </div>
        </header>

        <nav className="mt-6 grid grid-cols-5 gap-1 rounded-2xl bg-zinc-200/60 dark:bg-zinc-900 p-1" role="tablist">
          {tabs.map(([k, l, ic]) => (
            <button key={k} role="tab" data-tab={k} aria-selected={tab === k} onClick={() => setTab(k)}
              className={`min-w-0 flex flex-col lg:flex-row items-center justify-center gap-0.5 lg:gap-1.5 rounded-xl py-1.5 lg:py-2 text-[10px] sm:text-xs lg:text-sm font-semibold transition-all ${tab === k ? 'bg-white dark:bg-zinc-700 shadow-sm text-zinc-900 dark:text-white' : 'text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200'}`}>
              <Icon name={ic} size={16} /><span className="max-w-full truncate">{l}</span>
              {k === 'archive' && archivedCount > 0 && <span className="hidden sm:inline text-[11px] font-bold rounded-full bg-zinc-300/70 dark:bg-zinc-600 px-1.5">{archivedCount}</span>}
            </button>
          ))}
        </nav>

        <main className="mt-6" key={tab}>
          {tab === 'today' && <TodayView habits={habits} now={now} onToggle={toggle} onArchive={archive} onDelete={remove} onEdit={h => setHabitSheet(h)} onAdd={() => setHabitSheet('new')} />}
          {tab === 'pills' && <PillsView meds={meds} medLog={medLog} now={now} alarmsOn={alarmsOn} soundId={state.sound || 'classic'}
            hasAlarms={meds.some(m => m.alarm) || habits.some(h => !h.archived && h.remind)}
            onSound={v => setState(s => ({ ...s, sound: v }))}
            onToggleAlarms={v => { sound.unlock(); setState(s => ({ ...s, alarmsOn: v })); }}
            onTake={takeMed} onAdd={() => setMedSheet('new')} onEdit={m => setMedSheet(m)} onExactGranted={() => notify.plan(stRef.current)} />}
          {tab === 'medals' && <MedalsView habits={habits} />}
          {tab === 'stats' && <StatsView habits={habits} now={now} />}
          {tab === 'archive' && <ArchiveView habits={habits} onRestore={restore} onDelete={remove} />}
        </main>

        <footer className="mt-10 text-center">
          <button onClick={() => setShowPrivacy(true)} className="text-xs text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-300 underline underline-offset-2">Политика конфиденциальности</button>
        </footer>
      </div>

      <button onClick={openNew} aria-label={tab === 'pills' ? 'Новое лекарство' : 'Новая привычка'}
        className={`sm:hidden fixed end-5 bottom-6 z-40 w-14 h-14 rounded-full ${tab === 'pills' ? 'bg-violet-500' : 'bg-indigo-500'} text-white grid place-items-center shadow-[0_12px_28px_-8px_rgba(99,102,241,.9)] active:scale-90 transition`}
        style={{ marginBottom: 'env(safe-area-inset-bottom)' }}>
        <Icon name="plus" size={26} stroke={2.5} />
      </button>

      {showSettings && <SettingsSheet state={state} setState={setState} lock={lock} onLock={changeLock} onClose={() => setShowSettings(false)} onPrivacy={() => { setShowSettings(false); setShowPrivacy(true); }} />}
      {showPrivacy && <PrivacySheet onClose={() => setShowPrivacy(false)} />}
      {habitSheet && <HabitSheet initial={habitSheet === 'new' ? null : habitSheet} onClose={() => setHabitSheet(null)} onSave={saveHabit} />}
      {newMedal && <NewMedalModal n={newMedal} onClose={() => setNewMedal(null)} />}
      {medSheet && <MedSheet initial={medSheet === 'new' ? null : medSheet} onClose={() => setMedSheet(null)} onSave={saveMed} onDelete={deleteMed} />}
      {ringing.length > 0 && <AlarmModal items={ringing} onTake={takeFromAlarm} onSnooze={snooze} onStop={() => setRinging([])} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
